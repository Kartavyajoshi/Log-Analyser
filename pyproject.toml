[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyser"
version = "0.1.0"
description = "A lightweight CLI-based log analyzer for application and security logs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kartavya Joshi" }]
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
